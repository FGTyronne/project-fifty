name: alpaca-paper-connectivity

on:
  workflow_dispatch:
  push:
    branches:
      - ops/alpaca-connectivity-run
    paths:
      - .github/alpaca-paper-connectivity.trigger

permissions:
  contents: read

jobs:
  connectivity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Project Fifty
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Read-only Alpaca paper connectivity check
        env:
          ALPACA_PAPER_API_KEY: ${{ secrets.ALPACA_PAPER_API_KEY }}
          ALPACA_PAPER_API_SECRET: ${{ secrets.ALPACA_PAPER_API_SECRET }}
          ALPACA_PAPER_BASE_URL: https://paper-api.alpaca.markets
          ALPACA_PAPER_REQUEST_LOG: state/alpaca-request-ids.jsonl
        run: python scripts/alpaca_paper_connectivity.py
