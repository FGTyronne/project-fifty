name: alpaca-m10-readiness

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ALPACA_PAPER_API_KEY: ${{ secrets.ALPACA_PAPER_API_KEY }}
      ALPACA_PAPER_API_SECRET: ${{ secrets.ALPACA_PAPER_API_SECRET }}
      ALPACA_PAPER_BASE_URL: https://paper-api.alpaca.markets
      ALPACA_DATA_BASE_URL: https://data.alpaca.markets
      ALPACA_DATA_FEED: iex
      ALPACA_PAPER_REQUEST_LOG: state/alpaca-request-ids.jsonl
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Project Fifty
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Read-only M10 readiness
        run: python scripts/alpaca_m10_readiness.py
      - name: Upload readiness evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m10-readiness
          path: state/m10-readiness.json
          if-no-files-found: warn
          retention-days: 30
