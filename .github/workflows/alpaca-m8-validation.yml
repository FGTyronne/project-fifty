name: alpaca-m8-economic-validation

on:
  workflow_dispatch:
  push:
    branches:
      - m8/low-frequency-daily

permissions:
  contents: read

jobs:
  economic-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ALPACA_PAPER_API_KEY: ${{ secrets.ALPACA_PAPER_API_KEY }}
      ALPACA_PAPER_API_SECRET: ${{ secrets.ALPACA_PAPER_API_SECRET }}
      ALPACA_PAPER_BASE_URL: https://paper-api.alpaca.markets
      ALPACA_DATA_BASE_URL: https://data.alpaca.markets
      ALPACA_DATA_FEED: iex
      ALPACA_PAPER_REQUEST_LOG: state/alpaca-request-ids.jsonl
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Project Fifty
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: M8 disjoint frozen validation
        run: python scripts/alpaca_m8_validation.py
      - name: Upload M8 validation record
        uses: actions/upload-artifact@v4
        with:
          name: m8-economic-validation
          path: state/m8-economic-validation.json
          if-no-files-found: error
          retention-days: 30
