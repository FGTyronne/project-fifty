name: alpaca-m11-day-trader

on:
  workflow_dispatch:
  schedule:
    # GitHub's scheduler floor is five minutes. One 15-minute job contains five
    # three-minute autonomous cycles, giving Project Fifty the requested cadence
    # while keeping a single durable-state handoff between jobs.
    - cron: '*/15 13-21 * * 1-5'
  push:
    branches:
      - main
    paths:
      - .github/m11-paper.trigger

concurrency:
  group: project-fifty-paper-runtime
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  autonomous-day-trader:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      ALPACA_PAPER_API_KEY: ${{ secrets.ALPACA_PAPER_API_KEY }}
      ALPACA_PAPER_API_SECRET: ${{ secrets.ALPACA_PAPER_API_SECRET }}
      ALPACA_PAPER_BASE_URL: https://paper-api.alpaca.markets
      ALPACA_DATA_BASE_URL: https://data.alpaca.markets
      ALPACA_DATA_FEED: iex
      ALPACA_PAPER_REQUEST_LOG: state/alpaca-request-ids.jsonl
      PROJECT_FIFTY_STATE_DIR: state
      PROJECT_FIFTY_ENV: m11-paper
      PROJECT_FIFTY_STARTING_CASH_GBP: '50.00'
      PROJECT_FIFTY_ACCOUNT_CURRENCY: USD
      PROJECT_FIFTY_AUTHORIZED_STARTING_CASH: '67.6725'
      PROJECT_FIFTY_MAX_ORDER_NOTIONAL: '250'
      PROJECT_FIFTY_PERMITTED_SYMBOLS: 'AAPL,ABBV,ABNB,ADBE,AMD,AMAT,AMGN,AMZN,AVGO,BAC,BRK.B,CAT,CMCSA,COIN,CRM,CRWD,CSCO,CVX,DIA,DIS,GE,GLD,GM,GOOGL,GS,HD,IBM,INTC,IWM,JNJ,JPM,KO,LLY,LMT,MA,META,MRK,MS,MSFT,MU,NFLX,NOW,NVDA,ORCL,PANW,PEP,PFE,PLTR,PYPL,QCOM,QQQ,SLV,SMH,T,TLT,TSLA,UNH,V,WFC,WMT,XBI,XLE,XLF,XLI,XLK,XLP,XLU,XLV,XLY,XOM,SPY'
      PROJECT_FIFTY_MAX_STALE_SECONDS: '300'
      PROJECT_FIFTY_KILL_SWITCH: ${{ vars.PROJECT_FIFTY_KILL_SWITCH || 'false' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Restore durable Project Fifty state
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p state

          previous_run="$(
            gh api "/repos/${GITHUB_REPOSITORY}/actions/workflows/alpaca-m11-paper.yml/runs?per_page=50" \
              --jq '[.workflow_runs[] | select(.head_branch == "main" and .status == "completed" and .conclusion == "success")] | first | .id // empty'
          )"
          artifact_name="m11-runtime-state"

          if [[ -z "${previous_run}" ]]; then
            echo "No prior successful M11 run; migrating the latest successful M10 state."
            previous_run="$(
              gh api "/repos/${GITHUB_REPOSITORY}/actions/workflows/alpaca-m10-paper.yml/runs?per_page=50" \
                --jq '[.workflow_runs[] | select(.head_branch == "main" and .status == "completed" and .conclusion == "success")] | first | .id // empty'
            )"
            artifact_name="m10-runtime-state"
          fi

          if [[ -z "${previous_run}" ]]; then
            echo "No durable Project Fifty state exists. Failing closed instead of resetting capital."
            exit 1
          fi

          artifact_id="$(
            gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${previous_run}/artifacts?per_page=100" \
              --jq "[.artifacts[] | select(.name == \"${artifact_name}\" and .expired == false)] | first | .id // empty"
          )"
          if [[ -z "${artifact_id}" ]]; then
            echo "Durable state artifact is unavailable. Failing closed."
            exit 1
          fi

          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" > /tmp/project-fifty-state.zip
          unzip -o /tmp/project-fifty-state.zip -d state
          test -f state/m10-ledger.jsonl
          echo "Restored Project Fifty ledger from workflow run ${previous_run}."

      - name: Install Project Fifty
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Run three-minute autonomous day-trading watch
        shell: bash
        run: |
          set -euo pipefail
          for cycle in 1 2 3 4 5; do
            echo "M11 autonomous day-trading cycle ${cycle}/5"
            python scripts/alpaca_m11_paper_runtime.py
            if [[ "${cycle}" -lt 5 ]]; then
              sleep 180
            fi
          done

      - name: Upload durable M11 state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m11-runtime-state
          path: |
            state/m10-ledger.jsonl
            state/m11-runtime-summary.json
            state/alpaca-request-ids.jsonl
          if-no-files-found: warn
          retention-days: 90
